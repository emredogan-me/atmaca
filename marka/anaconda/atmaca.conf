# Kurucu (Anaconda) Atmaca'yı tanısın: ayarları Fedora KDE profilinden devralır
# (Btrfs bölümleme, önyükleyici ayarları vb. test edilmiş haliyle kalır).
[Profile]
profile_id = atmaca-kde
base_profile = fedora-kde

[Profile Detection]
os_id = atmaca
variant_id = kde

[Payload]
# Ağdan kurulumda paket imzalarını doğrulayan anahtar ve güncelleme deposu (atmaca-repos)
default_rpm_gpg_keys =
    /etc/pki/rpm-gpg/RPM-GPG-KEY-atmaca-$releasever-primary

updates_repositories =
    atmaca-updates
