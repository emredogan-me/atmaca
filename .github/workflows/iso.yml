# Atmaca ISO'sunu GitHub'ın sunucusunda üretir.
# Elle başlatmak: GitHub → Actions → "Atmaca ISO" → Run workflow
name: Atmaca ISO

on:
  workflow_dispatch:
    inputs:
      masaustu:
        description: "Masaüstü (kde / gnome)"
        default: kde
  push:
    branches: [main]
    paths: ["kickstart/**", "tarifler/**", ".github/workflows/iso.yml"]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MASAUSTU: ${{ github.event.inputs.masaustu || 'kde' }}
    steps:
      - uses: actions/checkout@v4

      # Sunucuda ~14 GB boş yer var; kullanmadığımız araçları silip ~45 GB'a çıkarıyoruz
      - name: Yer aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af
          df -h /

      - name: Fedora 44 kabında ISO üret
        run: |
          mkdir -p build
          sudo docker run --rm --privileged -e MASAUSTU="$MASAUSTU" -v /dev:/dev -v "$PWD":/atmaca -w /atmaca \
            registry.fedoraproject.org/fedora:44 bash -euxc '
              dnf -y install lorax pykickstart anaconda-core anaconda-tui \
                  grub2-efi-x64-cdboot grub2-tools-extra grub2-pc-modules shim-x64 syslinux \
                  xorriso policycoreutils
              # Fedora kabi yer kazanmak icin yalnizca Ingilizce ceviri kurar; ISO tum dilleri icersin
              rm -f /etc/rpm/macros.image-language-conf
              # Canli ISO acilis menusu: varsayilan "Start Atmaca Linux", bekleme 10 sn
              sed -i -e "s/^set default=.*/set default=\"0\"/" -e "s/^set timeout=.*/set timeout=10/" \
                  /usr/share/lorax/templates.d/99-generic/live/config_files/x86/grub2-efi.cfg \
                  /usr/share/lorax/templates.d/99-generic/live/config_files/x86/grub2-bios.cfg
              bash tarifler/marka-derle.sh
              ksflatten -c kickstart/atmaca-${MASAUSTU}.ks -o build/atmaca-${MASAUSTU}.ks
              ksvalidator build/atmaca-${MASAUSTU}.ks
              livemedia-creator --make-iso --no-virt \
                --ks build/atmaca-${MASAUSTU}.ks \
                --resultdir build/iso \
                --project "Atmaca" --releasever "Linux" \
                --volid Atmaca-${MASAUSTU} \
                --iso-name atmaca-${MASAUSTU}.iso \
                --logfile build/livemedia.log || true
              # Fedora 44 lorax sonucu images/boot.iso olarak birakir, adini biz veriyoruz
              if [ -f build/iso/images/boot.iso ]; then
                mv build/iso/images/boot.iso build/iso/atmaca-${MASAUSTU}.iso
              fi
              # Kayıtları runner kullanıcısı da okuyabilsin (yükleme adımı için)
              chmod -R a+rX build
            '
          # Kabın ürettiği dosyalar root'a ait; sonraki adımlar runner kullanıcısıyla yazabilsin
          sudo chown -R "$(id -u):$(id -g)" build
          ls -lh build/iso
          # ISO yoksa hata ver ve nedenini doğrudan ekrana bas
          if ! ls build/iso/atmaca-*.iso >/dev/null 2>&1; then
            echo "::error::ISO oluşmadı"
            tail -60 build/livemedia.log || true
            tail -60 build/program.log || true
            exit 1
          fi

      - name: Marka denetimi
        if: always()
        run: cat build/marka-denetim.txt 2>/dev/null || echo "Denetim raporu oluşmadı"

      - name: Marka denetim raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marka-denetimi
          path: build/marka-denetim.txt
          if-no-files-found: ignore

      - name: Sağlama toplamı
        run: cd build/iso && sha256sum atmaca-*.iso | tee SHA256SUMS

      - name: ISO'yu yükle
        uses: actions/upload-artifact@v4
        with:
          name: atmaca-${{ env.MASAUSTU }}-iso
          path: |
            build/iso/atmaca-*.iso
            build/iso/SHA256SUMS
            build/depo/*.rpm
          compression-level: 0
          retention-days: 14

      # ISO'yu QEMU'da açıp ekran görüntüleri alır (kurulum yapmaz, canlı oturum)
      - name: QEMU'da açılış testi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf imagemagick socat > /dev/null
          sudo chmod 666 /dev/kvm || true
          mkdir -p build/test
          # UEFI ile, 4 GB bellek, 4 çekirdek; ekran yok, monitör bir sokete bağlı
          qemu-system-x86_64 -enable-kvm -m 4096 -smp 4 -machine q35 \
            -bios /usr/share/ovmf/OVMF.fd \
            -cdrom build/iso/atmaca-${MASAUSTU}.iso -boot d \
            -vga virtio -display none \
            -nic user,model=virtio-net-pci \
            -serial file:build/test/seri-konsol.txt \
            -monitor unix:/tmp/qmon,server,nowait &
          sleep 5
          # 15 saniyede bir, 6 dakika boyunca ekran görüntüsü
          for i in $(seq -w 1 24); do
            sleep 15
            echo "screendump /tmp/ekran.ppm" | socat - unix-connect:/tmp/qmon > /dev/null || true
            [ -f /tmp/ekran.ppm ] && convert /tmp/ekran.ppm build/test/ekran-$i-$((10#$i*15))sn.png
          done
          echo "quit" | socat - unix-connect:/tmp/qmon || true
          ls -l build/test

      - name: Test ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-ekranlari
          path: build/test/
          if-no-files-found: ignore

      - name: Hata olursa kayıtları yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kayitlar
          path: |
            build/*.log
            build/anaconda/
          if-no-files-found: ignore
